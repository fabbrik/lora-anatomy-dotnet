name: ci
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # The unit tests need no model files: the merge math and the safetensors reader
      # are tested against hand-built inputs. The PEFT cross-check (reference/) needs
      # torch and is run locally -- see README.
      - run: dotnet test LoraAnatomy.slnx --configuration Release
